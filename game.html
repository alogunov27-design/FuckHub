<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщество • FuckHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f1117; color: #c5d1e0; font-family: system-ui, -apple-system, sans-serif; }
        .game-card { transition: all 0.25s ease; background: #1a1f2e; }
        .game-card:hover { transform: translateY(-4px); border-color: #3a455a; }
    </style>
</head>
<body>

<nav class="bg-[#0f1117] border-b border-[#1f2533] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 flex justify-between items-center h-14">
        <a href="index.html" class="flex items-center gap-2 text-xl font-bold">
            ← <span>FUCK</span><span class="text-orange-500">HUB</span>
        </a>
        <span class="font-semibold text-orange-500">Сообщество</span>
    </div>
</nav>

<div class="max-w-7xl mx-auto px-4 sm:px-8 py-8 sm:py-10">

    <!-- СПИСОК ИГР -->
    <div id="games-view">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold">Сообщество</h1>
                <p class="text-zinc-400 text-sm mt-1">Выбери игру — арты, видео и обсуждения</p>
            </div>
            <button onclick="showUploadModal()" class="bg-orange-500 hover:bg-orange-600 text-black font-semibold px-5 py-3 rounded-2xl shrink-0">
                + Выложить контент
            </button>
        </div>
        <div id="games-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <p class="col-span-full text-center py-16 text-zinc-500">Загрузка...</p>
        </div>
    </div>

    <!-- ПОСТЫ ИГРЫ -->
    <div id="posts-view" class="hidden">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div class="flex items-center gap-3 flex-wrap">
                <button onclick="backToGames()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-sm">← Назад</button>
                <div>
                    <h1 id="game-title" class="text-xl sm:text-2xl font-bold">Игра</h1>
                    <p class="text-zinc-400 text-sm">Арты, видео и обсуждения</p>
                </div>
            </div>
            <button onclick="showUploadModal()" class="bg-orange-500 hover:bg-orange-600 text-black font-semibold px-5 py-3 rounded-2xl shrink-0">
                + Выложить контент
            </button>
        </div>
        <div id="posts-container" class="space-y-6"></div>
    </div>
</div>

<!-- Модал -->
<div id="upload-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
    <div class="bg-[#1a1f2e] border border-[#2a3344] rounded-3xl p-6 sm:p-8 w-full max-w-md">
        <h2 class="text-xl font-semibold mb-5">Выложить контент</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-zinc-400 mb-1">К какой игре?</label>
                <select id="game-select" class="w-full px-4 py-3 bg-[#11141c] border border-[#2a3344] rounded-2xl"></select>
            </div>
            <div>
                <label class="block text-sm text-zinc-400 mb-1">Тип контента</label>
                <select id="content-type" class="w-full px-4 py-3 bg-[#11141c] border border-[#2a3344] rounded-2xl">
                    <option value="image">Изображение</option>
                    <option value="video">Видео</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-zinc-400 mb-1">Ссылка на контент</label>
                <input id="media-url" type="text" placeholder="https://..." class="w-full px-4 py-3 bg-[#11141c] border border-[#2a3344] rounded-2xl">
            </div>
            <div>
                <label class="block text-sm text-zinc-400 mb-1">Описание</label>
                <textarea id="post-desc" class="w-full px-4 py-3 bg-[#11141c] border border-[#2a3344] rounded-2xl h-20"></textarea>
            </div>
        </div>
        <div class="flex gap-3 mt-6">
            <button onclick="uploadPost()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-black font-semibold py-3 rounded-2xl">Опубликовать</button>
            <button onclick="hideUploadModal()" class="flex-1 bg-zinc-700 hover:bg-zinc-600 py-3 rounded-2xl">Отмена</button>
        </div>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://nuyeqiiopptdykxvurrk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_6YKf0lc-mTAB0FdVhQQzcQ_DFttxToY';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let gamesList = [];
let currentGameId = null;

async function init() {
    try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) currentUser = session.user;
        await loadGames();
    } catch (e) {
        document.getElementById('games-grid').innerHTML =
            '<p class="col-span-full text-center py-16 text-red-400">Ошибка: ' + e.message + '</p>';
    }
}

async function loadGames() {
    const grid = document.getElementById('games-grid');
    grid.innerHTML = '<p class="col-span-full text-center py-16 text-zinc-500">Загрузка...</p>';

    const { data, error } = await supabaseClient
        .from('games')
        .select('id, title, cover, author, is_nsfw')
        .order('created_at', { ascending: false });

    if (error) {
        grid.innerHTML = '<p class="col-span-full text-center py-16 text-red-400">Ошибка: ' + error.message + '</p>';
        return;
    }

    gamesList = data || [];
    fillSelect();

    if (gamesList.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center py-16 text-zinc-500">Пока нет игр</p>';
        return;
    }

    let html = '';
    for (let i = 0; i < gamesList.length; i++) {
        const g = gamesList[i];
        const cover = g.cover || 'https://picsum.photos/400/300?grayscale';
        const nsfw = g.is_nsfw ? '<span class="bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded-full">18+</span>' : '';
        html += '<div class="game-card rounded-2xl overflow-hidden border border-[#2a3344] cursor-pointer" onclick="openGame(\'' + g.id + '\')">' +
            '<div class="relative">' +
                '<img src="' + cover + '" class="w-full h-44 object-cover" onerror="this.src=\'https://picsum.photos/400/300?grayscale\'">' +
                '<div class="absolute top-3 right-3">' + nsfw + '</div>' +
            '</div>' +
            '<div class="p-4">' +
                '<h3 class="font-semibold text-base mb-1">' + (g.title || 'Без названия') + '</h3>' +
                '<p class="text-sm text-zinc-400">' + (g.author || '') + '</p>' +
            '</div>' +
        '</div>';
    }
    grid.innerHTML = html;
}

function fillSelect() {
    const select = document.getElementById('game-select');
    select.innerHTML = '<option value="">Выбери игру...</option>';
    for (let i = 0; i < gamesList.length; i++) {
        const opt = document.createElement('option');
        opt.value = gamesList[i].id;
        opt.textContent = gamesList[i].title || 'Без названия';
        if (currentGameId && gamesList[i].id === currentGameId) opt.selected = true;
        select.appendChild(opt);
    }
}

function backToGames() {
    currentGameId = null;
    document.getElementById('games-view').classList.remove('hidden');
    document.getElementById('posts-view').classList.add('hidden');
}

async function openGame(gameId) {
    currentGameId = gameId;
    let title = 'Игра';
    for (let i = 0; i < gamesList.length; i++) {
        if (gamesList[i].id === gameId) {
            title = gamesList[i].title || 'Игра';
            break;
        }
    }
    document.getElementById('game-title').textContent = title;
    document.getElementById('games-view').classList.add('hidden');
    document.getElementById('posts-view').classList.remove('hidden');
    fillSelect();
    await loadPosts(gameId);
}

async function loadPosts(gameId) {
    const container = document.getElementById('posts-container');
    container.innerHTML = '<p class="text-center py-12 text-zinc-500">Загрузка...</p>';

    const { data: posts, error } = await supabaseClient
        .from('community_posts')
        .select('*')
        .eq('game_id', gameId)
        .order('created_at', { ascending: false });

    if (error) {
        container.innerHTML = '<p class="text-center py-12 text-red-400">Ошибка: ' + error.message + '</p>';
        return;
    }

    if (!posts || posts.length === 0) {
        container.innerHTML = '<p class="text-center py-12 text-zinc-500">Пока нет контента. Выложи первый пост.</p>';
        return;
    }

    container.innerHTML = '';

    for (let i = 0; i < posts.length; i++) {
        const post = posts[i];
        const reactions = post.reactions || {};

        let mediaHTML = '';
        if (post.video_url) {
            mediaHTML = '<video controls class="w-full aspect-video bg-black rounded-xl"><source src="' + post.video_url + '"></video>';
        } else if (post.image_url) {
            mediaHTML = '<img src="' + post.image_url + '" class="w-full rounded-xl object-cover" onerror="this.src=\'https://picsum.photos/800/450\'">';
        }

        const reactionsList = ['❤️', '👍', '🔥', '😂', '😮'];
        let reactionsHTML = '';
        for (let r = 0; r < reactionsList.length; r++) {
            const emoji = reactionsList[r];
            const count = reactions[emoji] || 0;
            reactionsHTML += '<button onclick="addReaction(\'' + post.id + '\', \'' + emoji + '\')" class="hover:scale-110 transition-transform text-2xl">' +
                emoji + (count > 0 ? ' <span class="text-sm">' + count + '</span>' : '') +
            '</button> ';
        }

        const { data: comments } = await supabaseClient
            .from('post_comments')
            .select('*')
            .eq('post_id', post.id)
            .order('created_at', { ascending: true });

        let commentsHTML = '';
        if (comments && comments.length > 0) {
            for (let c = 0; c < comments.length; c++) {
                commentsHTML += '<div class="text-sm border-t border-[#2a3344] pt-3 mt-3">' +
                    '<span class="font-semibold text-orange-400">' + (comments[c].username || 'Аноним') + '</span>' +
                    '<p class="text-zinc-300 mt-1">' + (comments[c].content || '') + '</p>' +
                '</div>';
            }
        }

        const date = post.created_at ? new Date(post.created_at).toLocaleDateString('ru-RU') : '';

        const postDiv = document.createElement('div');
        postDiv.className = 'bg-[#1a1f2e] rounded-2xl border border-[#2a3344] overflow-hidden';
        postDiv.innerHTML =
            '<div class="p-5">' +
                '<div class="flex justify-between mb-3"><span class="text-xs text-zinc-500">' + date + '</span></div>' +
                (post.description ? '<p class="mb-4 text-zinc-200">' + post.description + '</p>' : '') +
                (mediaHTML ? '<div class="mb-4 rounded-xl overflow-hidden border border-[#2a3344]">' + mediaHTML + '</div>' : '') +
                '<div class="flex gap-4 mb-5 text-2xl">' + reactionsHTML + '</div>' +
                '<div>' +
                    '<button onclick="toggleComments(this)" class="text-sm font-medium mb-2 text-zinc-400 hover:text-white">Комментарии (' + (comments ? comments.length : 0) + ') ▼</button>' +
                    '<div class="comments-section hidden">' +
                        (commentsHTML || '<p class="text-xs text-zinc-500 py-2">Комментариев нет</p>') +
                    '</div>' +
                    '<div class="flex gap-2 mt-3">' +
                        '<input type="text" id="comment-input-' + post.id + '" placeholder="Комментарий..." class="flex-1 px-4 py-2 bg-[#11141c] border border-[#2a3344] rounded-xl text-sm">' +
                        '<button onclick="addComment(\'' + post.id + '\')" class="px-4 bg-orange-500 hover:bg-orange-600 text-black font-semibold rounded-xl text-sm">Отправить</button>' +
                    '</div>' +
                '</div>' +
            '</div>';
        container.appendChild(postDiv);
    }
}

function toggleComments(btn) {
    const section = btn.parentElement.querySelector('.comments-section');
    section.classList.toggle('hidden');
    btn.textContent = section.classList.contains('hidden')
        ? btn.textContent.replace('▼', '▶')
        : btn.textContent.replace('▶', '▼');
}

async function addReaction(postId, emoji) {
    const { data: post } = await supabaseClient.from('community_posts').select('reactions').eq('id', postId).single();
    const reactions = post.reactions || {};
    reactions[emoji] = (reactions[emoji] || 0) + 1;
    await supabaseClient.from('community_posts').update({ reactions: reactions }).eq('id', postId);
    if (currentGameId) loadPosts(currentGameId);
}

async function addComment(postId) {
    const input = document.getElementById('comment-input-' + postId);
    const content = (input.value || '').trim();
    if (!content) return;

    const username = currentUser
        ? (currentUser.user_metadata && currentUser.user_metadata.username) || (currentUser.email ? currentUser.email.split('@')[0] : 'User')
        : 'Аноним';

    const { error } = await supabaseClient.from('post_comments').insert({
        post_id: postId,
        content: content,
        username: username,
        user_id: currentUser ? currentUser.id : null
    });

    if (error) {
        alert('Ошибка: ' + error.message);
    } else {
        input.value = '';
        if (currentGameId) loadPosts(currentGameId);
    }
}

function showUploadModal() {
    fillSelect();
    document.getElementById('media-url').value = '';
    document.getElementById('post-desc').value = '';
    document.getElementById('upload-modal').classList.remove('hidden');
}

function hideUploadModal() {
    document.getElementById('upload-modal').classList.add('hidden');
}

async function uploadPost() {
    const gameId = document.getElementById('game-select').value;
    const type = document.getElementById('content-type').value;
    const mediaUrl = document.getElementById('media-url').value.trim();
    const description = document.getElementById('post-desc').value.trim();

    if (!gameId || !mediaUrl) {
        alert('Выбери игру и укажи ссылку');
        return;
    }

    const data = {
        game_id: gameId,
        description: description || null,
        user_id: currentUser ? currentUser.id : null
    };
    if (type === 'image') data.image_url = mediaUrl;
    else data.video_url = mediaUrl;

    const { error } = await supabaseClient.from('community_posts').insert(data);

    if (error) {
        alert('Ошибка: ' + error.message);
    } else {
        alert('Опубликовано!');
        hideUploadModal();
        if (currentGameId === gameId) {
            loadPosts(gameId);
        } else {
            loadGames();
        }
    }
}

window.onload = init;
</script>
</body>
</html>
