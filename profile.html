<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль • FuckHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f1117; color: #c5d1e0; }
        .game-card { transition: all 0.3s ease; background: #1a1f2e; }
        .platform-btn, .tag-btn { transition: all 0.2s; }
        .platform-btn.active, .tag-btn.active { background-color: #f97316; color: black; font-weight: 600; }
        .avatar-img { object-fit: cover; background: #1f2533; }
        .cover-preview { object-fit: cover; background: #11141c; }
        #publish-modal input, #publish-modal textarea, #avatar-modal input { color: #e5e7eb !important; background: #11141c !important; border: 1px solid #3a455a !important; }
    </style>
</head>
<body>

    <nav class="bg-[#0f1117] border-b border-[#1f2533] sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-8 flex justify-between items-center h-14">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold">
                ← <span>FUCK</span><span class="text-orange-500">HUB</span>
            </a>
            <span class="font-semibold text-orange-500">Профиль</span>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 sm:px-8 py-8 sm:py-10">

        <!-- Профиль -->
        <div class="bg-[#1a1f2e] rounded-3xl p-6 sm:p-8 mb-8 border border-[#2a3344]">
            <div class="flex flex-col sm:flex-row gap-6 items-start sm:items-center">
                <div class="relative shrink-0">
                    <img id="profile-avatar" 
                         src="https://ui-avatars.com/api/?name=User&background=1f2533&color=c5d1e0&size=128"
                         class="avatar-img w-24 h-24 sm:w-28 sm:h-28 rounded-full border-2 border-[#2a3344]"
                         alt="Аватар"
                         onerror="this.src='https://ui-avatars.com/api/?name=User&background=1f2533&color=c5d1e0&size=128'">
                </div>

                <div class="flex-1 min-w-0">
                    <h1 class="text-2xl sm:text-3xl font-semibold mb-1" id="profile-username">Загрузка...</h1>
                    <p class="text-zinc-400 text-sm sm:text-base mb-4" id="profile-email">Загрузка...</p>

                    <div class="flex flex-wrap gap-3">
                        <button onclick="showAvatarModal()" 
                                class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-sm transition-colors">
                            Изменить аватар
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Кнопка публикации -->
        <div class="mb-8">
            <button onclick="showPublishModal()" 
                    class="w-full sm:w-auto bg-orange-500 hover:bg-orange-600 text-black font-semibold px-8 py-3.5 rounded-2xl transition-colors">
                + Опубликовать новую игру
            </button>
        </div>

        <!-- Мои игры -->
        <div>
            <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                <h2 class="text-xl sm:text-2xl font-semibold">Мои опубликованные игры</h2>
                <button id="toggle-games-btn" onclick="toggleGamesVisibility()" 
                        class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-sm transition-colors">
                    Скрыть игры
                </button>
            </div>
            <div id="my-games-list" class="space-y-4">
                <p class="text-zinc-500 py-6 text-center">Загрузка игр...</p>
            </div>
        </div>
    </div>

    <!-- Модал аватара -->
    <div id="avatar-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-[#1a1f2e] border border-[#2a3344] rounded-3xl p-6 sm:p-8 w-full max-w-md">
            <h2 class="text-xl font-semibold mb-5">Аватар</h2>
            
            <div class="flex flex-col items-center gap-4 mb-5">
                <div class="w-28 h-28 rounded-full overflow-hidden border-2 border-[#2a3344] bg-[#11141c] flex items-center justify-center">
                    <img id="avatar-preview" src="" class="w-full h-full object-cover hidden" alt="Превью">
                    <span id="avatar-placeholder" class="text-zinc-500 text-xs text-center px-2">Нет фото</span>
                </div>
                <div class="w-full text-center">
                    <input type="file" id="avatar-file" accept="image/*" class="hidden" onchange="previewAvatar(this)">
                    <button type="button" onclick="document.getElementById('avatar-file').click()" 
                            class="px-5 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm font-medium transition-colors">
                        Выбрать файл
                    </button>
                    <p class="text-xs text-zinc-500 mt-2">До 1 МБ. JPG, PNG, WebP</p>
                    <p id="avatar-status" class="text-xs text-zinc-400 mt-1"></p>
                </div>
            </div>

            <div class="flex gap-3">
                <button id="save-avatar-btn" onclick="saveAvatar()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-black font-semibold py-3 rounded-xl">Сохранить</button>
                <button onclick="hideAvatarModal()" class="flex-1 bg-zinc-700 hover:bg-zinc-600 py-3 rounded-xl">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модал публикации -->
    <div id="publish-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-[#1a1f2e] border border-[#2a3344] rounded-3xl p-6 sm:p-8 w-full max-w-2xl my-8 max-h-[90vh] overflow-y-auto">
            <h2 id="modal-title" class="text-xl sm:text-2xl font-semibold mb-6 text-center">Публикация игры</h2>
            
            <div class="mb-5">
                <label for="game-title" class="block text-sm font-medium text-zinc-300 mb-2">Название игры *</label>
                <input id="game-title" type="text" placeholder="Например: Sweet Torment" 
                       class="w-full px-4 py-3.5 bg-[#11141c] border border-[#3a455a] rounded-2xl text-white">
            </div>

            <div class="mb-5">
                <p class="mb-2 text-sm font-medium text-zinc-400">Обложка</p>
                <div class="flex flex-col sm:flex-row gap-4 items-start">
                    <div class="w-full sm:w-40 h-40 rounded-2xl overflow-hidden border border-[#2a3344] shrink-0 bg-[#11141c] flex items-center justify-center">
                        <img id="cover-preview" src="" class="cover-preview w-full h-full hidden" alt="Превью">
                        <span id="cover-placeholder" class="text-zinc-500 text-sm text-center px-3">Нет обложки</span>
                    </div>
                    <div class="flex-1 w-full">
                        <input type="file" id="cover-file" accept="image/*" class="hidden" onchange="previewCover(this)">
                        <button type="button" onclick="document.getElementById('cover-file').click()" 
                                class="w-full sm:w-auto px-5 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm font-medium transition-colors">
                            Выбрать файл
                        </button>
                        <p class="text-xs text-zinc-500 mt-2">До 1 МБ. JPG, PNG, WebP. Лучше горизонтальная.</p>
                        <p id="cover-status" class="text-xs text-zinc-400 mt-1"></p>
                    </div>
                </div>
            </div>
            
            <div class="mb-5">
                <label class="block text-sm text-zinc-400 mb-1">Описание</label>
                <textarea id="game-desc" placeholder="Кратко о чём игра..." 
                          class="w-full px-4 py-3.5 bg-[#11141c] border border-[#2a3344] rounded-2xl h-28"></textarea>
            </div>
            
            <div class="mb-5">
                <p class="mb-2 text-sm font-medium text-zinc-400">Платформы</p>
                <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="togglePlatform(this)" data-platform="PC" class="platform-btn px-4 py-2 bg-[#1f2533] rounded-xl text-sm">🖥️ PC</button>
                    <button type="button" onclick="togglePlatform(this)" data-platform="Android" class="platform-btn px-4 py-2 bg-[#1f2533] rounded-xl text-sm">📱 Android</button>
                    <button type="button" onclick="togglePlatform(this)" data-platform="iOS" class="platform-btn px-4 py-2 bg-[#1f2533] rounded-xl text-sm">🍎 iOS</button>
                    <button type="button" onclick="togglePlatform(this)" data-platform="Web" class="platform-btn px-4 py-2 bg-[#1f2533] rounded-xl text-sm">🌐 Web</button>
                </div>
            </div>

            <div class="mb-5">
                <p class="mb-2 text-sm font-medium text-zinc-400">Теги</p>
                <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="toggleTag(this)" data-tag="Furry" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Furry</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Adult" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Adult</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="NSFW" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">NSFW</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Horror" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Horror</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Action" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Action</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="RPG" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">RPG</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Visual Novel" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Visual Novel</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Adventure" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Adventure</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Simulation" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Simulation</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Puzzle" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Puzzle</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Comedy" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Comedy</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Romance" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Romance</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Yiff" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Yiff</button>
                    <button type="button" onclick="toggleTag(this)" data-tag="Anthro" class="tag-btn px-3 py-1.5 bg-[#1f2533] rounded-xl text-sm">Anthro</button>
                </div>
            </div>

            <div class="mb-5 flex items-center gap-3">
                <input type="checkbox" id="game-nsfw" class="w-4 h-4 accent-orange-500">
                <label for="game-nsfw" class="text-sm">Это 18+ контент</label>
            </div>

            <div class="mb-6">
                <label class="block text-sm text-zinc-400 mb-1">Ссылка на скачивание</label>
                <input id="game-download" type="url" placeholder="https://..." 
                       class="w-full px-4 py-3.5 bg-[#11141c] border border-[#2a3344] rounded-2xl">
            </div>

            <div class="flex gap-3">
                <button id="save-game-btn" onclick="saveGame()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-black font-semibold py-3.5 rounded-2xl">Сохранить</button>
                <button onclick="hidePublishModal()" class="flex-1 bg-zinc-700 hover:bg-zinc-600 py-3.5 rounded-2xl">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        let selectedPlatforms = [];
        let selectedTags = [];
        let editingGameId = null;
        let gamesVisible = true;
        let currentCoverUrl = null;
        let pendingAvatarFile = null;

        async function init() {
            try {
                await getSession();
                if (!currentUser) {
                    alert("Вы не авторизованы!");
                    window.location.href = "index.html";
                    return;
                }

                const username = currentUser.user_metadata?.username || (currentUser.email ? currentUser.email.split('@')[0] : 'User');
                document.getElementById('profile-username').textContent = username;
                document.getElementById('profile-email').textContent = currentUser.email || 'нет email';

                const avatarUrl = currentUser.user_metadata?.avatar_url;
                if (avatarUrl) document.getElementById('profile-avatar').src = avatarUrl;
                else document.getElementById('profile-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}&background=1f2533&color=c5d1e0&size=128`;

                await loadMyGames();
            } catch (e) {
                console.error(e);
                document.getElementById('profile-username').textContent = 'Ошибка загрузки';
                document.getElementById('profile-email').textContent = e.message || 'ошибка';
            }
        }

        function showAvatarModal() {
            pendingAvatarFile = null;
            document.getElementById('avatar-file').value = '';
            document.getElementById('avatar-status').textContent = '';

            const current = currentUser?.user_metadata?.avatar_url || '';
            const preview = document.getElementById('avatar-preview');
            const placeholder = document.getElementById('avatar-placeholder');

            if (current) {
                preview.src = current;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                preview.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
            document.getElementById('avatar-modal').classList.remove('hidden');
        }

        function hideAvatarModal() { document.getElementById('avatar-modal').classList.add('hidden'); pendingAvatarFile = null; }

        function previewAvatar(input) {
            const file = input.files && input.files[0];
            const preview = document.getElementById('avatar-preview');
            const placeholder = document.getElementById('avatar-placeholder');
            const status = document.getElementById('avatar-status');

            if (!file) {
                preview.classList.add('hidden');
                placeholder.classList.remove('hidden');
                status.textContent = '';
                pendingAvatarFile = null;
                return;
            }
            if (!file.type.startsWith('image/')) { alert('Выбери изображение'); input.value = ''; return; }
            if (file.size > MAX_FILE_SIZE) { alert('Файл слишком большой. Максимум 1 МБ'); input.value = ''; return; }

            pendingAvatarFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                status.textContent = `Файл выбран: ${file.name} (${Math.round(file.size / 1024)} КБ)`;
            };
            reader.readAsDataURL(file);
        }

        async function saveAvatar() {
            if (!pendingAvatarFile) { alert('Выбери файл'); return; }
            const btn = document.getElementById('save-avatar-btn');
            const oldText = btn.textContent;
            btn.textContent = 'Загрузка...'; btn.disabled = true;

            try {
                // ЗАМЕНА: Используем uploadFileToStorage из script.js
                const avatarUrl = await uploadFileToStorage(pendingAvatarFile, 'avatars');
                if (!avatarUrl) throw new Error('Не удалось загрузить аватар');

                const { data, error } = await supabaseClient.auth.updateUser({ data: { avatar_url: avatarUrl } });
                if (error) throw error;

                if (data?.user) currentUser = data.user;
                else if (currentUser) {
                    if (!currentUser.user_metadata) currentUser.user_metadata = {};
                    currentUser.user_metadata.avatar_url = avatarUrl;
                }

                document.getElementById('profile-avatar').src = avatarUrl;
                hideAvatarModal();
                alert('Аватар обновлён!');
            } catch (e) {
                console.error(e);
                alert('Ошибка: ' + e.message);
            } finally {
                btn.textContent = oldText; btn.disabled = false;
            }
        }

        function toggleGamesVisibility() {
            gamesVisible = !gamesVisible;
            const list = document.getElementById('my-games-list');
            const btn = document.getElementById('toggle-games-btn');
            if (gamesVisible) { list.classList.remove('hidden'); btn.textContent = 'Скрыть игры'; } 
            else { list.classList.add('hidden'); btn.textContent = 'Показать игры'; }
        }

        function togglePlatform(btn) {
            btn.classList.toggle('active');
            const platform = btn.getAttribute('data-platform');
            selectedPlatforms = selectedPlatforms.includes(platform) ? selectedPlatforms.filter(p => p !== platform) : [...selectedPlatforms, platform];
        }

        function toggleTag(btn) {
            btn.classList.toggle('active');
            const tag = btn.getAttribute('data-tag');
            selectedTags = selectedTags.includes(tag) ? selectedTags.filter(t => t !== tag) : [...selectedTags, tag];
        }

        function previewCover(input) {
            const file = input.files && input.files[0];
            const preview = document.getElementById('cover-preview');
            const placeholder = document.getElementById('cover-placeholder');
            const status = document.getElementById('cover-status');

            if (!file) { preview.classList.add('hidden'); placeholder.classList.remove('hidden'); status.textContent = ''; return; }
            if (!file.type.startsWith('image/')) { alert('Выбери изображение'); input.value = ''; return; }
            if (file.size > MAX_FILE_SIZE) { alert('Файл слишком большой'); input.value = ''; return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                status.textContent = `Файл выбран: ${file.name} (${Math.round(file.size / 1024)} КБ)`;
            };
            reader.readAsDataURL(file);
        }

        function showPublishModal(game = null) {
            document.getElementById('publish-modal').classList.remove('hidden');
            editingGameId = game ? game.id : null;
            document.getElementById('modal-title').textContent = game ? "Редактировать игру" : "Новая игра";

            selectedPlatforms = []; selectedTags = [];
            document.querySelectorAll('.platform-btn, .tag-btn').forEach(el => el.classList.remove('active'));

            currentCoverUrl = null;
            document.getElementById('cover-file').value = '';
            document.getElementById('cover-preview').classList.add('hidden');
            document.getElementById('cover-placeholder').classList.remove('hidden');
            document.getElementById('cover-status').textContent = '';

            if (game) {
                document.getElementById('game-title').value = game.title || '';
                document.getElementById('game-desc').value = game.description || '';
                document.getElementById('game-download').value = game.download || '';
                document.getElementById('game-nsfw').checked = !!game.is_nsfw;

                currentCoverUrl = game.cover || null;
                if (currentCoverUrl) {
                    const preview = document.getElementById('cover-preview');
                    preview.src = currentCoverUrl;
                    preview.classList.remove('hidden');
                    document.getElementById('cover-placeholder').classList.add('hidden');
                    document.getElementById('cover-status').textContent = 'Текущая обложка';
                }

                if (game.platforms) {
                    selectedPlatforms = typeof game.platforms === 'string' ? game.platforms.split(',').map(p => p.trim()).filter(Boolean) : (Array.isArray(game.platforms) ? game.platforms : []);
                }
                if (game.tags) {
                    selectedTags = Array.isArray(game.tags) ? game.tags.slice() : [];
                }
                document.querySelectorAll('.platform-btn').forEach(btn => { if (selectedPlatforms.indexOf(btn.getAttribute('data-platform')) !== -1) btn.classList.add('active'); });
                document.querySelectorAll('.tag-btn').forEach(btn => { if (selectedTags.indexOf(btn.getAttribute('data-tag')) !== -1) btn.classList.add('active'); });
            } else {
                document.getElementById('game-title').value = '';
                document.getElementById('game-desc').value = '';
                document.getElementById('game-download').value = '';
                document.getElementById('game-nsfw').checked = false;
            }
        }

        function hidePublishModal() { document.getElementById('publish-modal').classList.add('hidden'); }

        async function saveGame() {
            const title = document.getElementById('game-title').value.trim();
            if (!title) return alert("Название игры обязательно!");
            if (!currentUser) return alert("Нет пользователя");

            const btn = document.getElementById('save-game-btn');
            const oldText = btn.textContent;
            btn.textContent = 'Сохранение...'; btn.disabled = true;

            try {
                const fileInput = document.getElementById('cover-file');
                const file = fileInput.files && fileInput.files[0];
                let coverUrl = currentCoverUrl;

                if (file) {
                    if (file.size > MAX_FILE_SIZE) { alert('Файл слишком большой'); return; }
                    document.getElementById('cover-status').textContent = 'Загрузка обложки...';
                    // ЗАМЕНА: Используем uploadFileToStorage из script.js
                    coverUrl = await uploadFileToStorage(file, 'game_covers');
                    document.getElementById('cover-status').textContent = coverUrl ? 'Обложка загружена' : 'Ошибка загрузки';
                    if (!coverUrl) return;
                }

                const authorName = currentUser.user_metadata?.username || (currentUser.email ? currentUser.email.split('@')[0] : 'User');

                const gameData = {
                    title: title,
                    cover: coverUrl || null,
                    description: document.getElementById('game-desc').value.trim() || null,
                    platforms: selectedPlatforms.join(', '),
                    tags: selectedTags,
                    download: document.getElementById('game-download').value.trim() || null,
                    is_nsfw: document.getElementById('game-nsfw').checked,
                    author: authorName,
                    user_id: currentUser.id
                };

                if (editingGameId) {
                    const { error } = await supabaseClient.from('games').update(gameData).eq('id', editingGameId);
                    if (error) throw error;
                    alert("Игра обновлена!");
                } else {
                    const { error } = await supabaseClient.from('games').insert(gameData);
                    if (error) throw error;
                    alert("Игра опубликована!");
                }
                hidePublishModal();
                await loadMyGames();
            } catch (e) {
                console.error(e); alert("Ошибка: " + e.message);
            } finally {
                btn.textContent = oldText; btn.disabled = false;
            }
        }

        async function deleteGame(gameId, title) {
            if (!confirm('Удалить игру «' + title + '»?\nЭто действие нельзя отменить.')) return;
            try {
                const { error } = await supabaseClient.from('games').delete().eq('id', gameId);
                if (error) throw error;
                alert('Игра удалена');
                await loadMyGames();
            } catch (e) { console.error(e); alert('Ошибка удаления: ' + e.message); }
        }

        async function loadMyGames() {
            const container = document.getElementById('my-games-list');
            if (!currentUser || !currentUser.id) { container.innerHTML = '<p class="text-red-400 py-6 text-center">Нет ID пользователя</p>'; return; }

            try {
                const { data, error } = await supabaseClient.from('games').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
                if (error) { container.innerHTML = `<p class="text-red-400 py-6 text-center">Ошибка: ${error.message}</p>`; return; }

                if (!data || data.length === 0) {
                    const authorName = currentUser.user_metadata?.username || (currentUser.email ? currentUser.email.split('@')[0] : null);
                    if (authorName) {
                        const { data: data2, error: err2 } = await supabaseClient.from('games').select('*').eq('author', authorName).order('created_at', { ascending: false });
                        if (!err2 && data2 && data2.length > 0) { renderGamesList(data2); return; }
                    }
                    container.innerHTML = '<p class="text-zinc-500 py-10 text-center">У вас пока нет опубликованных игр</p>';
                    return;
                }
                renderGamesList(data);
            } catch (e) { console.error(e); container.innerHTML = `<p class="text-red-400 py-6 text-center">Ошибка: ${e.message}</p>`; }
        }

        function renderGamesList(data) {
            const container = document.getElementById('my-games-list');
            container.innerHTML = data.map(function(g) {
                let tagsHTML = '';
                if (g.tags) {
                    const tags = Array.isArray(g.tags) ? g.tags : [];
                    tagsHTML = tags.map(tag => `<span class="inline-block bg-[#1f2533] text-xs px-2.5 py-1 rounded-full">${tag}</span>`).join('');
                }
                const downloads = g.download_count || 0;
                const safeTitle = (g.title || 'Без названия').replace(/'/g, "\\'");
                const cover = g.cover || 'https://picsum.photos/200/200?grayscale';

                return `<div class="game-card rounded-2xl p-4 sm:p-5 border border-[#2a3344]">
                        <div class="flex flex-col sm:flex-row gap-4">
                            <img src="${cover}" class="w-full sm:w-28 h-40 sm:h-28 object-cover rounded-xl flex-shrink-0" onerror="this.src='https://picsum.photos/200/200?grayscale'">
                            <div class="flex-1 min-w-0 flex flex-col">
                                <div class="flex justify-between items-start gap-2">
                                    <h3 class="font-semibold text-lg leading-tight">${g.title || 'Без названия'}</h3>
                                    ${g.is_nsfw ? '<span class="bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded-full shrink-0">18+</span>' : ''}
                                </div>
                                <p class="text-sm text-zinc-400 mt-1">Скачано: ${downloads}</p>
                                ${tagsHTML ? `<div class="mt-2 flex flex-wrap gap-1.5">${tagsHTML}</div>` : ''}
                                <div class="mt-4 flex flex-wrap gap-2">
                                    <button onclick='showPublishModal(${JSON.stringify(g).replace(/'/g, "&#39;")})' class="px-4 py-2.5 bg-zinc-700 hover:bg-zinc-600 rounded-xl text-sm transition-colors">Редактировать</button>
                                    <a href="${g.download || '#'}" target="_blank" class="px-4 py-2.5 bg-orange-500 hover:bg-orange-600 text-black font-semibold rounded-xl text-sm transition-colors">Скачать</a>
                                    <button onclick="deleteGame('${g.id}', '${safeTitle}')" class="px-4 py-2.5 bg-red-900/60 hover:bg-red-800 text-red-200 rounded-xl text-sm transition-colors">Удалить</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }).join('');
            if (!gamesVisible) container.classList.add('hidden'); else container.classList.remove('hidden');
        }

        window.onload = init;
    </script>
</body>
</html>
