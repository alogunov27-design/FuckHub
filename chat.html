<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Чат • FuckHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <style>
        body { background: #0f1117; color: #c5d1e0; font-family: system-ui, sans-serif; }
        .message-user { background: #1a1f2e; border: 1px solid #2a3344; }
        .message-assistant { background: #1f2533; border: 1px solid #3a455a; }
        .chat-container { max-height: 70vh; overflow-y: auto; }
        .avatar-img { object-fit: cover; background: #1f2533; }
    </style>
</head>
<body>

<nav class="bg-[#0f1117] border-b border-[#1f2533] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 flex justify-between items-center h-14">
        <a href="index.html" class="flex items-center gap-2 text-xl font-bold">
            ← <span>FUCK</span><span class="text-orange-500">HUB</span>
        </a>
        <span class="font-semibold text-orange-500">AI Чат</span>
    </div>
</nav>

<div class="max-w-4xl mx-auto px-4 sm:px-8 py-8">

    <!-- Выбор персонажа (скрывается, если уже есть session_id) -->
    <div id="character-selector" class="mb-6">
        <label class="block text-sm font-medium text-zinc-400 mb-2">Выбери персонажа:</label>
        <select id="character-select" class="w-full px-4 py-3 bg-[#1a1f2e] border border-[#2a3344] rounded-2xl text-white">
            <option value="">Загрузка...</option>
        </select>
    </div>

    <!-- Окно чата -->
    <div id="chat-window" class="chat-container space-y-4 mb-4 p-4 bg-[#11141c] rounded-2xl border border-[#2a3344] min-h-[400px]">
        <p class="text-center text-zinc-500 py-16">Загрузка сообщений...</p>
    </div>

    <!-- Форма ввода -->
    <div class="flex flex-col gap-2">
        <textarea id="message-input" rows="2" placeholder="Твоё сообщение..." 
                  class="w-full px-4 py-3 bg-[#1a1f2e] border border-[#2a3344] rounded-2xl text-white resize-none"></textarea>
        <div class="flex flex-col sm:flex-row gap-2">
            <input id="action-input" type="text" placeholder="*действия* (опционально)" 
                   class="flex-1 px-4 py-2 bg-[#1a1f2e] border border-[#2a3344] rounded-xl text-sm text-white">
            <input id="image-input" type="text" placeholder="(команда на картинку)" 
                   class="flex-1 px-4 py-2 bg-[#1a1f2e] border border-[#2a3344] rounded-xl text-sm text-white">
            <button id="send-btn" class="px-6 py-2 bg-orange-500 hover:bg-orange-600 text-black font-semibold rounded-xl shrink-0">
                Отправить
            </button>
        </div>
    </div>
</div>

<script>
    let currentCharacterId = null;
    let currentSessionId = null;
    let currentUserId = null;

    // Получаем session_id из URL
    const urlParams = new URLSearchParams(window.location.search);
    const sessionIdFromUrl = urlParams.get('session');

    // Инициализация
    async function init() {
        await getSession();
        if (!currentUser) {
            alert('Авторизуйся!');
            window.location.href = 'index.html';
            return;
        }
        currentUserId = currentUser.id;

        // Если есть session_id — загружаем историю, иначе показываем список персонажей
        if (sessionIdFromUrl) {
            currentSessionId = sessionIdFromUrl;
            document.getElementById('character-selector').style.display = 'none';
            await loadSessionInfo(sessionIdFromUrl);
            await loadHistory(sessionIdFromUrl);
        } else {
            await loadCharacters();
        }
    }

    // Загрузка информации о сессии (персонаж)
    async function loadSessionInfo(sessionId) {
        const { data, error } = await supabaseClient
            .from('ai_chat_sessions')
            .select('character_id, title')
            .eq('id', sessionId)
            .single();

        if (error) {
            alert('Ошибка загрузки сессии: ' + error.message);
            return;
        }

        currentCharacterId = data.character_id;
        document.querySelector('nav span.font-semibold').textContent = data.title || 'Чат';
    }

    // Загрузка истории сообщений
    async function loadHistory(sessionId) {
        const window = document.getElementById('chat-window');
        window.innerHTML = '<p class="text-center text-zinc-500 py-16">Загрузка сообщений...</p>';

        const { data, error } = await supabaseClient
            .from('ai_messages')
            .select('*')
            .eq('session_id', sessionId)
            .order('created_at', { ascending: true });

        if (error) {
            window.innerHTML = '<p class="text-red-400 text-center py-16">Ошибка: ' + error.message + '</p>';
            return;
        }

        if (!data || data.length === 0) {
            window.innerHTML = '<p class="text-center text-zinc-500 py-16">Нет сообщений. Напиши что-нибудь.</p>';
            return;
        }

        window.innerHTML = '';
        for (const msg of data) {
            addMessage(msg.role, msg.content, msg.action_text, msg.image_url);
        }
    }

    // Загрузка списка персонажей
    async function loadCharacters() {
        const select = document.getElementById('character-select');
        const { data, error } = await supabaseClient
            .from('ai_characters')
            .select('id, name')
            .eq('is_public', true)
            .order('name');

        if (error) {
            select.innerHTML = '<option value="">Ошибка загрузки</option>';
            return;
        }

        if (!data || data.length === 0) {
            select.innerHTML = '<option value="">Нет персонажей</option>';
            return;
        }

        select.innerHTML = '<option value="">Выбери персонажа</option>';
        data.forEach(char => {
            const opt = document.createElement('option');
            opt.value = char.id;
            opt.textContent = char.name;
            select.appendChild(opt);
        });

        select.onchange = function() {
            currentCharacterId = this.value;
            currentSessionId = null;
            document.getElementById('chat-window').innerHTML = '<p class="text-center text-zinc-500 py-16">Выбери персонажа и начни общение</p>';
        };
    }

    // Отправка сообщения
    document.getElementById('send-btn').onclick = async function() {
        const message = document.getElementById('message-input').value.trim();
        const action = document.getElementById('action-input').value.trim();
        const imageCmd = document.getElementById('image-input').value.trim();

        if (!currentCharacterId && !currentSessionId) {
            alert('Выбери персонажа!');
            return;
        }
        if (!message) {
            alert('Напиши сообщение!');
            return;
        }

        // Добавляем сообщение пользователя в чат
        addMessage('user', message, action);

        // Очищаем поля
        document.getElementById('message-input').value = '';
        document.getElementById('action-input').value = '';
        document.getElementById('image-input').value = '';

        // Показываем индикатор загрузки
        const loadingId = addLoadingMessage();

        try {
            // Вызываем SQL-функцию через RPC
            const { data, error } = await supabaseClient.rpc('chat_process', {
                p_character_id: currentCharacterId,
                p_user_id: currentUserId,
                p_user_message: message,
                p_session_id: currentSessionId || null,
                p_action_text: action || null,
                p_image_command: imageCmd || null
            });

            if (error) throw error;

            // Обновляем session_id
            if (data.session_id) {
                currentSessionId = data.session_id;
                // Обновляем заголовок
                document.querySelector('nav span.font-semibold').textContent = data.message?.slice(0, 30) || 'Чат';
            }

            // Удаляем индикатор загрузки
            removeLoadingMessage(loadingId);

            // Добавляем ответ ассистента
            addMessage('assistant', data.message || '...', null, data.image_url);

        } catch (err) {
            removeLoadingMessage(loadingId);
            alert('Ошибка: ' + err.message);
        }
    };

    // Добавление сообщения в чат
    function addMessage(role, content, action, imageUrl) {
        const window = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `p-4 rounded-2xl ${role === 'user' ? 'message-user' : 'message-assistant'}`;

        let html = '';
        if (action) {
            html += `<p class="text-zinc-400 italic text-sm mb-1">${action}</p>`;
        }
        html += `<p class="text-white whitespace-pre-wrap">${content}</p>`;
        if (imageUrl) {
            html += `<img src="${imageUrl}" class="mt-3 max-w-full rounded-xl border border-[#2a3344]" onerror="this.style.display='none'">`;
        }
        div.innerHTML = html;
        window.appendChild(div);
        window.scrollTop = window.scrollHeight;
    }

    // Индикатор загрузки
    function addLoadingMessage() {
        const window = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = 'p-4 rounded-2xl message-assistant opacity-60';
        div.id = 'loading-' + Date.now();
        div.innerHTML = '<p class="text-zinc-400">печатает...</p>';
        window.appendChild(div);
        window.scrollTop = window.scrollHeight;
        return div.id;
    }

    function removeLoadingMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    // Enter для отправки
    document.getElementById('message-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            document.getElementById('send-btn').click();
        }
    });

    window.onload = init;
</script>

</body>
</html>
