<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Чат • FuckHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <style>
        body { background: #0f1117; color: #c5d1e0; font-family: system-ui, sans-serif; }
        .message-user { background: #1a1f2e; border: 1px solid #2a3344; }
        .message-assistant { background: #1f2533; border: 1px solid #3a455a; }
        .chat-container { max-height: 70vh; overflow-y: auto; scroll-behavior: smooth; }
        .avatar-img { object-fit: cover; background: #1f2533; }
        .delete-btn { transition: opacity 0.2s ease; }
        .delete-btn:hover { color: #f87171; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="bg-[#0f1117]/90 backdrop-blur-md border-b border-[#1f2533] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-14">
            <a href="index.html" class="flex items-center gap-1.5 shrink-0">
                <span class="text-2xl sm:text-3xl font-bold tracking-tighter">FUCK</span>
                <span class="text-2xl sm:text-3xl font-bold tracking-tighter text-orange-500">HUB</span>
            </a>
            <div class="flex items-center gap-4">
                <span id="chat-title" class="text-sm font-medium text-zinc-300 hidden sm:block">Чат</span>
                <button onclick="deleteCurrentChat()" class="delete-btn text-red-400 hover:text-red-300 text-sm font-medium px-3 py-1.5 rounded-xl hover:bg-red-900/30 transition-colors">
                    ✕ Удалить чат
                </button>
                <a href="chats.html" class="text-orange-400 hover:text-orange-300 text-sm font-medium transition-colors">
                    Мои чаты
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- ЧАТ -->
<div class="max-w-4xl mx-auto px-4 sm:px-8 py-6">

    <!-- Окно чата -->
    <div id="chat-window" class="chat-container space-y-4 mb-4 p-4 bg-[#11141c] rounded-2xl border border-[#2a3344] min-h-[400px] max-h-[70vh] overflow-y-auto">
        <p class="text-center text-zinc-500 py-16">Загрузка сообщений...</p>
    </div>

    <!-- Форма ввода -->
    <div class="flex flex-col gap-2">
        <textarea id="message-input" rows="2" placeholder="Твоё сообщение..." 
                  class="w-full px-4 py-3 bg-[#1a1f2e] border border-[#2a3344] rounded-2xl text-white resize-none focus:outline-none focus:border-orange-500/60"></textarea>
        <div class="flex flex-col sm:flex-row gap-2">
            <input id="action-input" type="text" placeholder="*действия* (опционально)" 
                   class="flex-1 px-4 py-2 bg-[#1a1f2e] border border-[#2a3344] rounded-xl text-sm text-white focus:outline-none focus:border-orange-500/60">
            <input id="image-input" type="text" placeholder="(команда на картинку)" 
                   class="flex-1 px-4 py-2 bg-[#1a1f2e] border border-[#2a3344] rounded-xl text-sm text-white focus:outline-none focus:border-orange-500/60">
            <button id="send-btn" class="px-6 py-2 bg-orange-500 hover:bg-orange-600 text-black font-semibold rounded-xl shrink-0 transition-colors">
                Отправить
            </button>
        </div>
    </div>
</div>

<script>
    let currentCharacterId = null;
    let currentSessionId = null;
    let currentUserId = null;

    const urlParams = new URLSearchParams(window.location.search);
    const sessionIdFromUrl = urlParams.get('session');

    async function init() {
        await getSession();
        if (!currentUser) {
            alert('Авторизуйся!');
            window.location.href = 'index.html';
            return;
        }
        currentUserId = currentUser.id;

        if (sessionIdFromUrl) {
            currentSessionId = sessionIdFromUrl;
            await loadSessionInfo(sessionIdFromUrl);
            await loadHistory(sessionIdFromUrl);
        } else {
            document.getElementById('chat-window').innerHTML = '<p class="text-center text-zinc-500 py-16">Не выбрана сессия</p>';
        }
    }

    async function loadSessionInfo(sessionId) {
        const { data, error } = await supabaseClient
            .from('ai_chat_sessions')
            .select('character_id, title, character:ai_characters(name)')
            .eq('id', sessionId)
            .single();

        if (error) {
            alert('Ошибка загрузки сессии: ' + error.message);
            return;
        }

        currentCharacterId = data.character_id;
        const charName = data.character?.name || 'Персонаж';
        document.getElementById('chat-title').textContent = charName + ' • ' + (data.title || 'Чат');
    }

    async function loadHistory(sessionId) {
        const window = document.getElementById('chat-window');
        window.innerHTML = '<p class="text-center text-zinc-500 py-16">Загрузка сообщений...</p>';

        const { data, error } = await supabaseClient
            .from('ai_messages')
            .select('*')
            .eq('session_id', sessionId)
            .order('created_at', { ascending: true });

        if (error) {
            window.innerHTML = '<p class="text-red-400 text-center py-16">Ошибка: ' + error.message + '</p>';
            return;
        }

        if (!data || data.length === 0) {
            window.innerHTML = '<p class="text-center text-zinc-500 py-16">Нет сообщений. Напиши что-нибудь.</p>';
            return;
        }

        window.innerHTML = '';
        for (const msg of data) {
            addMessage(msg.role, msg.content, msg.action_text, msg.image_url);
        }
    }

    function addMessage(role, content, action, imageUrl) {
        const window = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `p-4 rounded-2xl ${role === 'user' ? 'message-user' : 'message-assistant'}`;

        let html = '';
        if (action) {
            html += `<p class="text-zinc-400 italic text-sm mb-1">${action}</p>`;
        }
        html += `<p class="text-white whitespace-pre-wrap">${content}</p>`;
        if (imageUrl) {
            html += `<img src="${imageUrl}" class="mt-3 max-w-full rounded-xl border border-[#2a3344]" onerror="this.style.display='none'">`;
        }
        div.innerHTML = html;
        window.appendChild(div);
        window.scrollTop = window.scrollHeight;
    }

    document.getElementById('send-btn').onclick = async function() {
        const message = document.getElementById('message-input').value.trim();
        const action = document.getElementById('action-input').value.trim();
        const imageCmd = document.getElementById('image-input').value.trim();

        if (!currentCharacterId && !currentSessionId) {
            alert('Ошибка: нет сессии');
            return;
        }
        if (!message) {
            alert('Напиши сообщение!');
            return;
        }

        addMessage('user', message, action);
        document.getElementById('message-input').value = '';
        document.getElementById('action-input').value = '';
        document.getElementById('image-input').value = '';

        const loadingId = addLoadingMessage();

        try {
            const { data, error } = await supabaseClient.rpc('chat_process', {
                p_character_id: currentCharacterId,
                p_user_id: currentUserId,
                p_user_message: message,
                p_session_id: currentSessionId || null,
                p_action_text: action || null,
                p_image_command: imageCmd || null
            });

            if (error) throw error;

            if (data.session_id) {
                currentSessionId = data.session_id;
            }

            removeLoadingMessage(loadingId);
            addMessage('assistant', data.message || '...', null, data.image_url);

        } catch (err) {
            removeLoadingMessage(loadingId);
            alert('Ошибка: ' + err.message);
        }
    };

    function addLoadingMessage() {
        const window = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = 'p-4 rounded-2xl message-assistant opacity-60';
        div.id = 'loading-' + Date.now();
        div.innerHTML = '<p class="text-zinc-400">печатает...</p>';
        window.appendChild(div);
        window.scrollTop = window.scrollHeight;
        return div.id;
    }

    function removeLoadingMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    async function deleteCurrentChat() {
        if (!currentSessionId) return;
        if (!confirm('Точно удалить этот чат? Все сообщения сотрутся нахуй.')) return;

        try {
            const { error: msgsError } = await supabaseClient
                .from('ai_messages')
                .delete()
                .eq('session_id', currentSessionId);

            if (msgsError) throw msgsError;

            const { error: sessionError } = await supabaseClient
                .from('ai_chat_sessions')
                .delete()
                .eq('id', currentSessionId);

            if (sessionError) throw sessionError;

            alert('Чат удалён.');
            window.location.href = 'chats.html';
        } catch (e) {
            console.error('Ошибка удаления:', e);
            alert('Не удалось удалить чат: ' + e.message);
        }
    }

    document.getElementById('message-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            document.getElementById('send-btn').click();
        }
    });

    window.onload = init;
</script>
</body>
</html>
