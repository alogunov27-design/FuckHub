<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FNWP 2 — касса</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    body { background: #07060a; }
    .neon { text-shadow: 0 0 18px #ff2d8f; }
    .btn { transition: .15s transform, .15s filter; }
    .btn:active { transform: scale(.98); }
  </style>
</head>
<body class="min-h-screen text-pink-50">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="flex items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-4xl font-black italic neon text-pink-400">FNWP 2</h1>
        <p class="text-pink-200/60 text-sm">FuckFaz Studios · касса и аккаунт</p>
      </div>
      <div id="who" class="text-sm text-pink-200/70"></div>
    </header>

    <p id="banner" class="hidden mb-4 rounded-xl border border-pink-500/30 bg-pink-500/10 px-4 py-3 text-sm"></p>

    <!-- AUTH -->
    <section id="view-auth" class="grid md:grid-cols-2 gap-6">
      <form id="form-login" class="rounded-2xl border border-pink-500/20 bg-black/40 p-5 space-y-3">
        <h2 class="text-xl font-bold text-pink-300">Вход</h2>
        <input name="email" type="email" required placeholder="почта" class="w-full rounded-lg bg-zinc-900 border border-pink-500/20 px-3 py-2" />
        <input name="password" type="password" required placeholder="пароль" class="w-full rounded-lg bg-zinc-900 border border-pink-500/20 px-3 py-2" />
        <button class="btn w-full rounded-lg bg-pink-600 hover:bg-pink-500 py-2 font-bold">Войти</button>
      </form>

      <form id="form-reg" class="rounded-2xl border border-pink-500/20 bg-black/40 p-5 space-y-3">
        <h2 class="text-xl font-bold text-pink-300">Регистрация</h2>
        <input name="nickname" minlength="3" maxlength="20" required placeholder="ник (уникальный)" class="w-full rounded-lg bg-zinc-900 border border-pink-500/20 px-3 py-2" />
        <input name="email" type="email" required placeholder="почта" class="w-full rounded-lg bg-zinc-900 border border-pink-500/20 px-3 py-2" />
        <input name="password" type="password" minlength="6" required placeholder="пароль от 6 символов" class="w-full rounded-lg bg-zinc-900 border border-pink-500/20 px-3 py-2" />
        <p class="text-xs text-pink-200/50">Ник «FuckFaz» занят студией. Регистр не важен: Fexa и fexa — один ник.</p>
        <button class="btn w-full rounded-lg bg-pink-600 hover:bg-pink-500 py-2 font-bold">Создать аккаунт</button>
      </form>
    </section>

    <!-- APP -->
    <section id="view-app" class="hidden space-y-6">
      <div class="flex flex-wrap gap-2">
        <button data-tab="shop" class="tab btn rounded-lg border border-pink-500/40 px-4 py-2">Магазин</button>
        <button data-tab="mine" class="tab btn rounded-lg border border-pink-500/40 px-4 py-2">Мои сучки</button>
        <button data-tab="admin" id="tab-admin" class="hidden tab btn rounded-lg border border-yellow-400/50 px-4 py-2 text-yellow-200">Выдача</button>
        <button id="btn-out" class="btn ml-auto rounded-lg border border-zinc-600 px-4 py-2">Выйти</button>
      </div>

      <div id="tab-shop" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <div id="tab-mine" class="hidden rounded-2xl border border-pink-500/20 bg-black/40 p-5">
        <ul id="mine-list" class="space-y-2"></ul>
      </div>

      <div id="tab-admin" class="hidden rounded-2xl border border-yellow-400/30 bg-black/40 p-5 space-y-3">
        <h2 class="text-xl font-bold text-yellow-200">Выдать девочку</h2>
        <p class="text-sm text-pink-200/60">Работает только если в базе у тебя is_admin = true. Исходник страницы это не обходит.</p>
        <input id="grant-nick" placeholder="ник игрока (FuckFaz — себе)" class="w-full rounded-lg bg-zinc-900 border border-yellow-400/20 px-3 py-2" />
        <input id="grant-girl" placeholder="girl_id, например diana" class="w-full rounded-lg bg-zinc-900 border border-yellow-400/20 px-3 py-2" />
        <button id="btn-grant" class="btn rounded-lg bg-yellow-500 text-black font-bold px-4 py-2">Выдать</button>
      </div>
    </section>
  </div>

  <script>
    const CATALOG = [
      { id: "starter_door", name: "Стартовая · Дверь", price: "бесплатно" },
      { id: "diana", name: "Диана", price: "платная / вручную" },
      { id: "leopard", name: "Снежный леопард", price: "платная / вручную" },
      { id: "fox", name: "Лиса", price: "платная / вручную" },
      { id: "wolf_black", name: "Чёрная волчица", price: "платная / вручную" },
      { id: "bunny", name: "Зайка", price: "платная / вручную" },
    ];

    const cfg = window.FNWP_CONFIG || {};
    const ready = !!(cfg.supabaseUrl && cfg.supabaseAnonKey);
    const sb = ready ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey) : null;

    const $ = (id) => document.getElementById(id);
    const banner = (msg, ok) => {
      const el = $("banner");
      el.classList.remove("hidden");
      el.textContent = msg;
      el.style.color = ok ? "#86efac" : "#fda4af";
    };

    let me = null;
    let profile = null;
    let owned = [];

    function showAuth() {
      $("view-auth").classList.remove("hidden");
      $("view-app").classList.add("hidden");
      $("who").textContent = ready ? "" : "режим без Supabase — сначала config.js";
    }

    function showApp() {
      $("view-auth").classList.add("hidden");
      $("view-app").classList.remove("hidden");
      $("who").textContent = profile ? "@" + profile.nickname : "";
      $("tab-admin").classList.toggle("hidden", !profile?.is_admin);
      renderShop();
      renderMine();
    }

    function openTab(name) {
      ["shop", "mine", "admin"].forEach((t) => {
        const pane = document.getElementById("tab-" + t);
        if (pane) pane.classList.toggle("hidden", t !== name);
      });
    }

    function renderShop() {
      $("tab-shop").innerHTML = CATALOG.map((g) => {
        const have = owned.includes(g.id);
        return `<article class="rounded-2xl border border-pink-500/20 bg-black/40 p-4">
          <h3 class="font-bold text-lg">${g.name}</h3>
          <p class="text-sm text-pink-200/50">${g.id}</p>
          <p class="mt-2 text-pink-300">${have ? "уже есть" : g.price}</p>
        </article>`;
      }).join("");
    }

    function renderMine() {
      if (!owned.length) {
        $("mine-list").innerHTML = "<li>Пока пусто. Стартовых выдашь себе кнопкой Выдача.</li>";
        return;
      }
      $("mine-list").innerHTML = owned.map((id) => `<li class="border-b border-pink-500/10 py-2">${id}</li>`).join("");
    }

    async function loadProfile() {
      const { data, error } = await sb.from("profiles").select("nickname,is_admin").eq("id", me.id).maybeSingle();
      if (error) throw error;
      profile = data;
      const { data: girls, error: gErr } = await sb.from("owned_girls").select("girl_id").eq("user_id", me.id);
      if (gErr) throw gErr;
      owned = (girls || []).map((x) => x.girl_id);
    }

    $("form-login").onsubmit = async (e) => {
      e.preventDefault();
      if (!sb) return banner("Сначала заполни config.js");
      const fd = new FormData(e.target);
      const { data, error } = await sb.auth.signInWithPassword({
        email: fd.get("email"),
        password: fd.get("password"),
      });
      if (error) return banner(error.message);
      me = data.user;
      try {
        await loadProfile();
        showApp();
        banner("Вход ок", true);
      } catch (err) {
        banner(err.message || String(err));
      }
    };

    $("form-reg").onsubmit = async (e) => {
      e.preventDefault();
      if (!sb) return banner("Сначала заполни config.js");
      const fd = new FormData(e.target);
      const nickname = String(fd.get("nickname") || "").trim();
      const norm = nickname.toLowerCase();
      if (norm.length < 3) return banner("Ник слишком короткий");
      if ((cfg.reservedNicks || []).includes(norm)) {
        return banner("Ник зарезервирован студией");
      }

      const { data, error } = await sb.auth.signUp({
        email: fd.get("email"),
        password: fd.get("password"),
      });
      if (error) return banner(error.message);
      if (!data.user) return banner("Почта занята или нужно подтверждение письма");

      const { error: pErr } = await sb.rpc("register_profile", { nick: nickname });
      if (pErr) {
        const msg = pErr.message || "";
        if (msg.includes("profiles_nickname_norm_key") || msg.includes("duplicate")) {
          return banner("Ник уже занят");
        }
        if (msg.includes("nick_reserved")) return banner("Ник зарезервирован");
        return banner(msg);
      }
      banner("Аккаунт создан. Если включено подтверждение почты — сначала письмо, потом вход.", true);
    };

    $("btn-out").onclick = async () => {
      if (sb) await sb.auth.signOut();
      me = null;
      profile = null;
      owned = [];
      showAuth();
    };

    $("btn-grant").onclick = async () => {
      if (!sb) return banner("Нет Supabase");
      const nick = $("grant-nick").value.trim();
      const girl = $("grant-girl").value.trim();
      const { error } = await sb.rpc("admin_grant", { target_nick: nick, p_girl_id: girl });
      if (error) return banner(error.message);
      banner("Выдано " + girl + " → " + nick, true);
      await loadProfile();
      renderShop();
      renderMine();
    };

    document.querySelectorAll(".tab").forEach((b) => {
      b.onclick = () => openTab(b.dataset.tab);
    });

    (async () => {
      if (!ready) {
        banner("config.js пустой. Сайт открывается, но вход заработает после нового проекта Supabase.");
        showAuth();
        return;
      }
      const { data } = await sb.auth.getSession();
      if (data.session) {
        me = data.session.user;
        try {
          await loadProfile();
          showApp();
        } catch (err) {
          banner(err.message || String(err));
          showAuth();
        }
      } else {
        showAuth();
      }
    })();
  </script>
</body>
</html>
